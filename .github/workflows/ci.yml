# Runs on every pull request and every push to master. No Azure calls and no secrets:
# the unit tests mock the model, and the eval suite runs separately (evals.yml).
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET build, tests, docs index)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Kilowattcher.slnx

      - name: Build
        run: dotnet build Kilowattcher.slnx --no-restore -c Release -warnaserror

      - name: Unit tests
        run: dotnet test Kilowattcher.slnx --no-build -c Release

      - name: embeddings.json matches the docs
        run: dotnet run --project tools/embed --no-build -c Release -- --check

  web:
    name: Web (lint, typecheck, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
